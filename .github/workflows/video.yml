name: Otomatik Video Üret

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * 1,4'

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli paketleri yükle
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu
          pip install moviepy edge-tts google-generativeai requests pillow numpy imageio imageio-ffmpeg

      - name: Video üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python generate_video.py

      - name: Videoyu kaydet
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: video.mp4
